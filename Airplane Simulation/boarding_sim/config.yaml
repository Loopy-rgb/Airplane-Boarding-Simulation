# ============================================================
# Airplane Boarding Simulation – Configuration File
# ============================================================
# All parameters are defined here. Never hard-code these values
# in other modules; always load from this file.
#
# Source labels:
#   ASSUMED  – no published citation; reasonable engineering default
#   [citation pending] – placeholder for a real paper the student will fill in
# ============================================================

cabin:
  rows: 30                          # Airbus A320 economy rows [citation pending]
  seat_letters: [A, B, C, D, E, F] # Left block A-B-C, right block D-E-F
  row_pitch_m: 0.79                 # ASSUMED (literature range 0.75-0.81 m)

simulation:
  dt_seconds: 1                     # ASSUMED – one-second time step
  entry_interval_s: 3               # ASSUMED – one passenger enters every 3 s
  base_seat_time_s: 2               # ASSUMED – seconds to sit down with clear row
  shuffle_time_s:                   # ASSUMED – time per blocking seated passenger
    dist: uniform
    low: 4
    high: 10
  max_ticks: 5000                   # Safety cap; deadlock raises an error if hit

passenger:
  walk_speed_mps:                   # ASSUMED – normal distribution, clipped at min
    dist: normal
    mean: 0.8
    sd: 0.15
    min: 0.4
  bags_probs:                       # ASSUMED – baseline bag-count probabilities
    0: 0.15
    1: 0.60
    2: 0.25
  stow_time_s:                      # ASSUMED – lognormal draw per bag carried
    zero_bags: 0
    per_bag:
      dist: lognormal
      mean: 9                       # seconds (mean of underlying normal)
      sd: 4                         # ASSUMED

strategies:
  back_to_front_zones: 5            # ASSUMED – number of boarding zones (3-6)

experiment:
  replications: 200
  base_seed: 12345

# ============================================================
# Filipino Behavior Module – feature flags and parameters
# All parameters below are ASSUMED (no published Filipino-
# aviation data available at time of writing).
# ============================================================
behavior:
  group_travel:
    enabled: false                  # set true for Philippine scenario
    group_fraction: 0.40            # ASSUMED – fraction of pax in groups
    group_size_weights:             # ASSUMED – draw group size 2-4
      2: 0.50
      3: 0.25
      4: 0.25

  non_compliance:
    enabled: false                  # set true for Philippine scenario
    compliance_rate: 0.70           # ASSUMED – P(passenger follows call order)

  late_passengers:
    enabled: false                  # set true for Philippine scenario
    late_fraction: 0.03             # ASSUMED – fraction sent to end of queue

  heavy_handcarry:
    enabled: false                  # set true for Philippine scenario
    bags_probs:                     # ASSUMED – Philippine bag-count distribution
      0: 0.05
      1: 0.45
      2: 0.50

  bayanihan:                        # "helping" behavior – cuts stow time
    enabled: false                  # set true for Philippine scenario
    p_help: 0.15                    # ASSUMED – probability a neighbor helps
    help_reduction: 0.35            # ASSUMED – fraction by which stow time is cut

  seat_search_delay:
    enabled: false                  # set true for Philippine scenario
    seat_search_fraction: 0.10      # ASSUMED – fraction of pax with extra delay
    delay_s:                        # ASSUMED
      dist: uniform
      low: 5
      high: 15

  seat_swapping:                    # optional, implement last
    enabled: false
    swap_fraction: 0.05             # ASSUMED

# ============================================================
# Named scenario shortcuts (used by run scripts)
# ============================================================
scenarios:
  baseline:
    behavior:
      group_travel: {enabled: false}
      non_compliance: {enabled: false}
      late_passengers: {enabled: false}
      heavy_handcarry: {enabled: false}
      bayanihan: {enabled: false}
      seat_search_delay: {enabled: false}
      seat_swapping: {enabled: false}

  philippine:
    behavior:
      group_travel: {enabled: true}
      non_compliance: {enabled: true}
      late_passengers: {enabled: true}
      heavy_handcarry: {enabled: true}
      bayanihan: {enabled: true}
      seat_search_delay: {enabled: true}
      seat_swapping: {enabled: false}   # keep optional; disabled by default
